name: Compile CLEO scripts

on:
  push:
    branches: [main]
    paths:
      - "src/cleo/**"
      - ".github/workflows/compile-cleo.yml"
  pull_request:
    paths:
      - "src/cleo/**"
      - ".github/workflows/compile-cleo.yml"
  workflow_dispatch:

concurrency:
  group: cleo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Sanny Builder 4.2.0
        shell: pwsh
        run: |
          $url = "https://github.com/sannybuilder/dev/releases/download/v4.2.0/SannyBuilder-v4.2.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sanny.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\sanny.zip" -DestinationPath "$env:RUNNER_TEMP\sanny" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sanny" -Filter sanny.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No se encontró sanny.exe en el archivo oficial." }
          "SANNY_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile CLEO source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $sannyDir = Split-Path $env:SANNY_EXE -Parent
          Push-Location $sannyDir
          try {
            $smoke = Join-Path $env:RUNNER_TEMP "cleo-smoke-test.txt"
            @('{$CLEO .cs}', 'nop', 'terminate_this_script') | Set-Content -Encoding ASCII $smoke
            Write-Host "===== PRUEBA MINIMA DEL COMPILADOR ====="
            & $env:SANNY_EXE --no-splash --mode sa_sbl --compile $smoke (Join-Path $env:GITHUB_WORKSPACE "build/cleo-smoke-test.cs")
            $smokeExit = $LASTEXITCODE
            "Smoke test exit code: $smokeExit" | Out-File "$env:GITHUB_WORKSPACE/build/smoke-result.txt"
            if (Test-Path "compile.log") { Copy-Item "compile.log" "$env:GITHUB_WORKSPACE/build/smoke-compile.log" -Force; Remove-Item "compile.log" -Force }
            if ($smokeExit -ne 0) { throw "Sanny Builder no pudo compilar ni el script CLEO minimo (exit $smokeExit)." }

            Write-Host "===== COMPILACION DEL PROYECTO ====="
            & $env:SANNY_EXE --no-splash --mode sa_sbl --compile "$env:GITHUB_WORKSPACE/src/cleo/ME_Core_Menu.txt" "$env:GITHUB_WORKSPACE/build/ME_Core_Menu.cs"
            $compileExit = $LASTEXITCODE
            "Compiler exit code: $compileExit" | Out-File "$env:GITHUB_WORKSPACE/build/compiler-result.txt"
            if (Test-Path "compile.log") { Copy-Item "compile.log" "$env:GITHUB_WORKSPACE/build/compile.log" -Force }
          }
          finally { Pop-Location }
          Get-ChildItem build | Format-Table Name,Length
          if ($compileExit -ne 0) { throw "Falló la compilación CLEO del proyecto (exit $compileExit)." }
          if (-not (Test-Path "build/ME_Core_Menu.cs")) { throw "El compilador no generó el archivo .cs." }
          if ((Get-Item "build/ME_Core_Menu.cs").Length -lt 16) { throw "El archivo .cs generado parece vacío o incompleto." }

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-expandido-compiler-diagnostics
          path: build/
          if-no-files-found: warn

      - name: Upload compiled CLEO script
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-expandido-cleo-build
          path: build/ME_Core_Menu.cs
          if-no-files-found: error
