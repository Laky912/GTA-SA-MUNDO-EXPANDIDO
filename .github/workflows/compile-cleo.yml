name: Compile CLEO scripts

on:
  push:
    branches: [main]
    paths:
      - "src/cleo/**"
      - ".github/workflows/compile-cleo.yml"
  pull_request:
    paths:
      - "src/cleo/**"
      - ".github/workflows/compile-cleo.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Sanny Builder 4.2.0
        shell: pwsh
        run: |
          $url = "https://github.com/sannybuilder/dev/releases/download/v4.2.0/SannyBuilder-v4.2.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sanny.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\sanny.zip" -DestinationPath "$env:RUNNER_TEMP\sanny" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sanny" -Filter sanny.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No se encontró sanny.exe en el archivo oficial." }
          "SANNY_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile CLEO source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $proc = Start-Process -FilePath $env:SANNY_EXE -ArgumentList @("--no-splash", "--mode", "sa_sbl", "--compile", "src/cleo/ME_Core_Menu.txt", "build/ME_Core_Menu.cs") -PassThru -Wait -RedirectStandardOutput "build/compiler-stdout.txt" -RedirectStandardError "build/compiler-stderr.txt"
          "Compiler exit code: $($proc.ExitCode)" | Out-File "build/compiler-result.txt"
          if (Test-Path "compile.log") { Copy-Item "compile.log" "build/compile.log" -Force }
          if ($proc.ExitCode -ne 0) { throw "Falló la compilación CLEO. Revisa el artefacto de diagnósticos." }
          if (-not (Test-Path "build/ME_Core_Menu.cs")) { throw "El compilador no generó el archivo .cs." }

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-expandido-compiler-diagnostics
          path: build/
          if-no-files-found: warn

      - name: Upload compiled CLEO script
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-expandido-cleo-build
          path: build/ME_Core_Menu.cs
          if-no-files-found: error
