name: Compile CLEO and package map expansion

on:
  push:
    branches: [main]
    paths:
      - "src/cleo/**"
      - "src/asi/**"
      - "src/maps/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/compile-cleo.yml"
  pull_request:
    paths:
      - "src/cleo/**"
      - "src/maps/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/compile-cleo.yml"
  workflow_dispatch:

concurrency:
  group: mundo-expandido-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Sanny Builder 4.2.0
        shell: pwsh
        run: |
          $url = "https://github.com/sannybuilder/dev/releases/download/v4.2.0/SannyBuilder-v4.2.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sanny.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\sanny.zip" -DestinationPath "$env:RUNNER_TEMP\sanny" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sanny" -Filter sanny.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No se encontró sanny.exe en el archivo oficial." }
          "SANNY_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile CLEO source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $sannyDir = Split-Path $env:SANNY_EXE -Parent
          Push-Location $sannyDir
          try {
            function Wait-ForBinary([string]$Path, [int]$MinimumBytes) {
              $deadline = (Get-Date).AddSeconds(20)
              do {
                if (Test-Path -LiteralPath $Path) {
                  $item = Get-Item -LiteralPath $Path
                  if (-not $item.PSIsContainer -and $item.Length -ge $MinimumBytes) {
                    Write-Host "Binario detectado: $Path ($($item.Length) bytes)"
                    return $true
                  }
                }
                Start-Sleep -Milliseconds 500
              } while ((Get-Date) -lt $deadline)
              return $false
            }

            $smoke = Join-Path $env:RUNNER_TEMP "cleo-smoke-test.txt"
            @('{$CLEO .cs}', 'nop', 'terminate_this_script') | Set-Content -Encoding ASCII $smoke
            Write-Host "===== PRUEBA MINIMA DEL COMPILADOR ====="
            $smokeOut = Join-Path $env:GITHUB_WORKSPACE "build/cleo-smoke-test.cs"
            & $env:SANNY_EXE --mode sa_sbl --compile $smoke $smokeOut
            if (Test-Path "compile.log") {
              Copy-Item "compile.log" "$env:GITHUB_WORKSPACE/build/smoke-compile.log" -Force
              Remove-Item "compile.log" -Force
            }
            if (-not (Wait-ForBinary $smokeOut 8)) {
              throw "Sanny Builder no generó el binario de la prueba mínima en 20 segundos."
            }
            "Smoke test: output generated" | Out-File "$env:GITHUB_WORKSPACE/build/smoke-result.txt"

            Write-Host "===== COMPILACION DEL PROYECTO ====="
            $projectOut = Join-Path $env:GITHUB_WORKSPACE "build/ME_Core_Menu.cs"
            & $env:SANNY_EXE --mode sa_sbl --compile "$env:GITHUB_WORKSPACE/src/cleo/ME_Core_Menu.txt" $projectOut
            if (Test-Path "compile.log") {
              Copy-Item "compile.log" "$env:GITHUB_WORKSPACE/build/compile.log" -Force
            }
            if (-not (Wait-ForBinary $projectOut 16)) {
              throw "Sanny Builder no generó un binario válido para el panel CLEO en 20 segundos."
            }
            "Compiler: output generated" | Out-File "$env:GITHUB_WORKSPACE/build/compiler-result.txt"
          }
          finally { Pop-Location }
          Get-ChildItem build | Format-Table Name,Length
          if (-not (Test-Path "build/ME_Core_Menu.cs")) { throw "El compilador no generó el archivo .cs." }

      - name: Build frontend ASI plugin (Win32)
        shell: pwsh
        run: |
          cmake -S src/asi -B build/asi -A Win32
          cmake --build build/asi --config Release
          $asi = Get-ChildItem "build/asi" -Filter "MundoExpandido.asi" -Recurse | Select-Object -First 1
          if (-not $asi -or $asi.Length -lt 4096) {
            throw "No se generó un plugin ASI x86 válido."
          }
          New-Item -ItemType Directory -Force -Path "build/asi-output" | Out-Null
          Copy-Item $asi.FullName "build/asi-output/MundoExpandido.asi"
          "ASI build: $($asi.Length) bytes" | Out-File "build/asi-result.txt"

      - name: Validate map IPL structure
        shell: pwsh
        run: |
          $ipl = Get-Content "src/maps/costa_brava.ipl"
          $inside = $false
          $count = 0
          foreach ($line in $ipl) {
            $t = $line.Trim()
            if ($t -eq "inst") { $inside = $true; continue }
            if ($t -eq "end" -and $inside) { $inside = $false; continue }
            if ($inside -and $t -and -not $t.StartsWith("#")) {
              $fields = $t.Split(",")
              if ($fields.Count -ne 11) { throw "Registro IPL inválido: $t" }
              $q = @([double]$fields[6], [double]$fields[7], [double]$fields[8], [double]$fields[9])
              $norm = ($q | ForEach-Object { $_ * $_ } | Measure-Object -Sum).Sum
              if ([Math]::Abs($norm - 1.0) -gt 0.00001) { throw "Cuaternión inválido: $t" }
              $count++
            }
          }
          if ($inside -or $count -ne 73) { throw "IPL incompleto o cantidad inesperada: $count" }
          "Map IPL: $count registros validados" | Out-File "build/map-validation.txt"

      - name: Package complete project
        if: success()
        shell: pwsh
        run: |
          $stage = "dist/GTA-SA-Mundo-Expandido"
          $mapStage = "$stage/modloader/GTA-SA-Mundo-Expandido-Costa-Brava"
          New-Item -ItemType Directory -Force -Path "$stage/CLEO/CLEO_TEXT", "$stage/docs", "$mapStage/objects", "$mapStage/project" | Out-Null
          Copy-Item "build/ME_Core_Menu.cs" "$stage/CLEO/ME_Core_Menu.cs"
          Copy-Item "build/asi-output/MundoExpandido.asi" "$stage/MundoExpandido.asi"
          Copy-Item "src/asi/ME_MODOS.fxt" "$stage/CLEO/CLEO_TEXT/ME_MODOS.fxt"
          Copy-Item "src/maps/costa_brava.ipl" "$mapStage/objects/samsp_mundo_expandido_cbrv.ipl"
          Copy-Item "src/maps/Costa-Brava.sa-map-studio.json" "$mapStage/project/Costa-Brava.sa-map-studio.json"
          Copy-Item "docs/MAPA.md" "$stage/docs/MAPA.md" -ErrorAction SilentlyContinue
          Copy-Item "docs/INSTALACION_MAPA.md" "$stage/docs/INSTALACION_MAPA.md"
          Copy-Item "README.md" "$stage/README_PROYECTO.md"
          @(
            "# GTA San Andreas - Mundo Expandido / Costa Brava",
            "# Mod Loader merges this IPL entry into gta.dat",
            "IPL DATA\MAPS\SAMSP_MUNDO_EXPANDIDO_CBRV.IPL"
          ) | Set-Content -Encoding ASCII "$mapStage/README.txt"
          @(
            "GTA SAN ANDREAS - MUNDO EXPANDIDO",
            "",
            "Extrae el contenido del ZIP en la carpeta principal del juego.",
            "El mapa se instala en modloader\GTA-SA-Mundo-Expandido-Costa-Brava.",
            "El menu del frontend requiere MundoExpandido.asi en la carpeta principal del juego y ME_MODOS.fxt en CLEO\CLEO_TEXT.",
            "El panel CLEO es opcional: copia CLEO\ME_Core_Menu.cs a la carpeta CLEO del juego.",
            "",
            "Requisitos: GTA SA clasico PC 1.0 US; ASI Loader x86; CLEO 4; Mod Loader para el mapa.",
            "Desinstalacion: elimina MundoExpandido.asi, CLEO\CLEO_TEXT\ME_MODOS.fxt, CLEO\ME_Core_Menu.cs y la carpeta modloader\GTA-SA-Mundo-Expandido-Costa-Brava.",
            "",
            "El plugin ASI se compila para Win32 y usa direcciones del ejecutable GTA SA 1.0 US. El menu y los modos requieren prueba dentro del juego. El IPL se valida estructuralmente, pero la colocacion, colisiones, agua, LOD y rendimiento tambien requieren prueba in-game."
          ) | Set-Content -Encoding UTF8 "$stage/INSTALACION.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/GTA-SA-Mundo-Expandido-completo.zip" -Force

      - name: Upload complete ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-Mundo-Expandido-completo
          path: dist/GTA-SA-Mundo-Expandido-completo.zip
          if-no-files-found: error

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-expandido-compiler-diagnostics
          path: build/
          if-no-files-found: warn

      - name: Upload compiled CLEO script
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-expandido-cleo-build
          path: build/ME_Core_Menu.cs
          if-no-files-found: error
